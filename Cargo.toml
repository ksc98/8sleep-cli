[package]
name = "eightsleep"
version = "0.1.6"
edition = "2024"
description = "CLI for the Eight Sleep Pod"
license = "MIT"
repository = "https://github.com/ksc98/8sleep-cli"

[[bin]]
name = "8sleep"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
humantime = "2"
jiff = "0.2"
owo-colors = "4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "gzip", "rustls", "http2"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4.4"
toml_edit = "0.25"
